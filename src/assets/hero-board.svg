<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <!-- Иллюстрация для главной: стилизованная двухслойная плата мультивибратора, вид сверху.
       Медь — оранжевая, маска — зелёная, шелкография — белая. Декоративная, не чертёж. -->
  <defs>
    <pattern id="fr4" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#1d7246"/>
      <rect width="1" height="6" fill="#1a6a41"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="400" height="280" rx="16" fill="url(#fr4)" stroke="#145233" stroke-width="2"/>

  <!-- монтажные отверстия -->
  <g fill="#c9a36a" stroke="none">
    <circle cx="34" cy="34" r="9"/><circle cx="386" cy="34" r="9"/>
    <circle cx="34" cy="266" r="9"/><circle cx="386" cy="266" r="9"/>
  </g>
  <g fill="#0e1712">
    <circle cx="34" cy="34" r="5"/><circle cx="386" cy="34" r="5"/>
    <circle cx="34" cy="266" r="5"/><circle cx="386" cy="266" r="5"/>
  </g>

  <!-- дорожки (под маской медь выглядит светлее зелёного) -->
  <g stroke="#3fa56c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- питание сверху -->
    <path d="M60 128 H86 V62 H334"/>
    <path d="M130 62 V80"/><path d="M178 62 V80"/><path d="M242 62 V80"/><path d="M290 62 V80"/>
    <!-- светодиоды → коллекторные резисторы -->
    <path d="M130 120 V142"/><path d="M290 120 V142"/>
    <!-- коллекторы -->
    <path d="M130 182 V200 L140 210"/><path d="M290 182 V200 L280 210"/>
    <!-- перекрёстные конденсаторы -->
    <path d="M130 196 H168 L176 188 V170 H192"/><path d="M290 196 H252 L244 188 V170 H228"/>
    <path d="M228 170 L210 152 H192" opacity="0"/>
    <!-- базовые резисторы → базы -->
    <path d="M178 120 V150 L196 168"/><path d="M242 120 V150 L224 168"/>
    <path d="M192 230 V214 L160 214"/><path d="M228 230 V214 L260 214"/>
  </g>
  <!-- земля снизу -->
  <path d="M60 172 H86 V254 H334" stroke="#3fa56c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M176 254 V232" stroke="#3fa56c" stroke-width="7"/>
  <path d="M244 254 V232" stroke="#3fa56c" stroke-width="7"/>

  <!-- площадки (открытая медь) -->
  <g fill="#e08a45">
    <!-- разъём питания J1 -->
    <rect x="50" y="118" width="20" height="20" rx="2"/><circle cx="60" cy="172" r="10"/>
    <!-- D1, D2 -->
    <rect x="121" y="71" width="18" height="18" rx="2"/><circle cx="130" cy="120" r="9"/>
    <rect x="281" y="71" width="18" height="18" rx="2"/><circle cx="290" cy="120" r="9"/>
    <!-- R1..R4 -->
    <circle cx="130" cy="142" r="8"/><circle cx="130" cy="182" r="8"/>
    <circle cx="178" cy="80" r="8"/><circle cx="178" cy="120" r="8"/>
    <circle cx="242" cy="80" r="8"/><circle cx="242" cy="120" r="8"/>
    <circle cx="290" cy="142" r="8"/><circle cx="290" cy="182" r="8"/>
    <!-- C1, C2 -->
    <rect x="184" y="162" width="16" height="16" rx="2"/><circle cx="192" cy="230" r="8"/>
    <rect x="220" y="162" width="16" height="16" rx="2"/><circle cx="228" cy="230" r="8"/>
    <!-- Q1, Q2 (TO-92) -->
    <circle cx="146" cy="232" r="7"/><circle cx="160" cy="214" r="7"/><circle cx="176" cy="232" r="7"/>
    <circle cx="274" cy="232" r="7"/><circle cx="260" cy="214" r="7"/><circle cx="244" cy="232" r="7"/>
    <!-- переходные отверстия -->
    <circle cx="334" cy="62" r="6"/><circle cx="334" cy="254" r="6"/>
  </g>
  <!-- отверстия в площадках -->
  <g fill="#0e1712">
    <circle cx="60" cy="128" r="4"/><circle cx="60" cy="172" r="4"/>
    <circle cx="130" cy="80" r="3.5"/><circle cx="130" cy="120" r="3.5"/>
    <circle cx="290" cy="80" r="3.5"/><circle cx="290" cy="120" r="3.5"/>
    <circle cx="130" cy="142" r="3"/><circle cx="130" cy="182" r="3"/>
    <circle cx="178" cy="80" r="3"/><circle cx="178" cy="120" r="3"/>
    <circle cx="242" cy="80" r="3"/><circle cx="242" cy="120" r="3"/>
    <circle cx="290" cy="142" r="3"/><circle cx="290" cy="182" r="3"/>
    <circle cx="192" cy="170" r="3"/><circle cx="192" cy="230" r="3"/>
    <circle cx="228" cy="170" r="3"/><circle cx="228" cy="230" r="3"/>
    <circle cx="146" cy="232" r="2.5"/><circle cx="160" cy="214" r="2.5"/><circle cx="176" cy="232" r="2.5"/>
    <circle cx="274" cy="232" r="2.5"/><circle cx="260" cy="214" r="2.5"/><circle cx="244" cy="232" r="2.5"/>
    <circle cx="334" cy="62" r="2.5"/><circle cx="334" cy="254" r="2.5"/>
  </g>

  <!-- шелкография -->
  <g stroke="#f2f2f2" stroke-width="1.6" fill="none">
    <rect x="44" y="110" width="32" height="76" rx="3"/>
    <circle cx="130" cy="100" r="24"/><circle cx="290" cy="100" r="24"/>
    <rect x="120" y="134" width="20" height="56" rx="3"/><rect x="280" y="134" width="20" height="56" rx="3"/>
    <rect x="168" y="72" width="20" height="56" rx="3"/><rect x="232" y="72" width="20" height="56" rx="3"/>
    <circle cx="192" cy="200" r="18" stroke-dasharray="3 3"/><circle cx="228" cy="200" r="18" stroke-dasharray="3 3"/>
    <path d="M140 244 A22 22 0 1 1 182 244 Z"/>
    <path d="M238 244 A22 22 0 1 1 280 244 Z"/>
  </g>
  <g fill="#f2f2f2" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">
    <text x="46" y="104">J1</text>
    <text x="34" y="133" font-size="12">+</text>
    <text x="35" y="177" font-size="12">−</text>
    <text x="96" y="104">D1</text><text x="316" y="104">D2</text>
    <text x="98" y="166">R1</text><text x="306" y="166">R4</text>
    <text x="191" y="104">R2</text><text x="229" y="104" text-anchor="end">R3</text>
    <text x="180" y="196" font-size="9">C1</text><text x="216" y="196" font-size="9">C2</text>
    <text x="140" y="270">Q1</text><text x="266" y="270">Q2</text>
    <text x="300" y="282" font-size="9" font-weight="400">PCB-COURSE v1.0</text>
    <text x="196" y="148" font-size="10">+</text><text x="222" y="148" font-size="10">+</text>
  </g>
</svg>
